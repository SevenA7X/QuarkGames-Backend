name: quarkgames-ec2
services:
  db-auth:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: quarkgames_auth_db
      MYSQL_USER: quarkgames
      MYSQL_PASSWORD: ${DB_AUTH_PASSWORD:?Ejecuta configurar.sh}
      MYSQL_ROOT_PASSWORD: ${DB_AUTH_ROOT_PASSWORD:?Ejecuta configurar.sh}
    volumes:
    - mysql-auth:/var/lib/mysql
    command:
    - --innodb-buffer-pool-size=128M
    - --max-connections=50
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u quarkgames
        -D quarkgames_auth_db -Nse "SELECT 1" >/dev/null
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  auth:
    build:
      context: .
      args:
        MODULE: auth
    restart: unless-stopped
    environment:
      PORT: '8083'
      DB_URL: jdbc:mysql://db-auth:3306/quarkgames_auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USER: quarkgames
      DB_PASSWORD: ${DB_AUTH_PASSWORD:?Ejecuta configurar.sh}
      JWT_SECRET: ${JWT_SECRET:?Ejecuta configurar.sh}
      ADMIN_USUARIO: admin
      ADMIN_CLAVE: ${ADMIN_PASSWORD:?Ejecuta configurar.sh}
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx384m
    depends_on:
      db-auth:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, --max-time, '3', http://127.0.0.1:8083/actuator/health]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 35s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  db-catalogo:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: quarkgames_catalogo_db
      MYSQL_USER: quarkgames
      MYSQL_PASSWORD: ${DB_CATALOGO_PASSWORD:?Ejecuta configurar.sh}
      MYSQL_ROOT_PASSWORD: ${DB_CATALOGO_ROOT_PASSWORD:?Ejecuta configurar.sh}
    volumes:
    - mysql-catalogo:/var/lib/mysql
    command:
    - --innodb-buffer-pool-size=128M
    - --max-connections=50
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u quarkgames
        -D quarkgames_catalogo_db -Nse "SELECT 1" >/dev/null
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  catalogo:
    build:
      context: .
      args:
        MODULE: catalogo
    restart: unless-stopped
    environment:
      PORT: '8081'
      DB_URL: jdbc:mysql://db-catalogo:3306/quarkgames_catalogo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USER: quarkgames
      DB_PASSWORD: ${DB_CATALOGO_PASSWORD:?Ejecuta configurar.sh}
      JWT_SECRET: ${JWT_SECRET:?Ejecuta configurar.sh}
      INTERNAL_KEY: ${INTERNAL_API_KEY:?Ejecuta configurar.sh}
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx384m
    depends_on:
      db-catalogo:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, --max-time, '3', http://127.0.0.1:8081/actuator/health]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 35s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  db-carrito:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: quarkgames_carrito_db
      MYSQL_USER: quarkgames
      MYSQL_PASSWORD: ${DB_CARRITO_PASSWORD:?Ejecuta configurar.sh}
      MYSQL_ROOT_PASSWORD: ${DB_CARRITO_ROOT_PASSWORD:?Ejecuta configurar.sh}
    volumes:
    - mysql-carrito:/var/lib/mysql
    command:
    - --innodb-buffer-pool-size=128M
    - --max-connections=50
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u quarkgames
        -D quarkgames_carrito_db -Nse "SELECT 1" >/dev/null
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  carrito:
    build:
      context: .
      args:
        MODULE: carrito
    restart: unless-stopped
    environment:
      PORT: '8082'
      DB_URL: jdbc:mysql://db-carrito:3306/quarkgames_carrito_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USER: quarkgames
      DB_PASSWORD: ${DB_CARRITO_PASSWORD:?Ejecuta configurar.sh}
      INTERNAL_KEY: ${INTERNAL_API_KEY:?Ejecuta configurar.sh}
      CATALOGO_URL: http://catalogo:8081
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx384m
    depends_on:
      db-carrito:
        condition: service_healthy
      catalogo:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, --max-time, '3', http://127.0.0.1:8082/actuator/health]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 35s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    restart: unless-stopped
    environment:
      PORT: '8080'
      SERVER_FORWARD_HEADERS_STRATEGY: framework   # confía en X-Forwarded-Proto/Host que envía Caddy
      CATALOGO_URL: http://catalogo:8081
      CARRITO_URL: http://carrito:8082
      AUTH_URL: http://auth:8083
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?Ejecuta configurar.sh}
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx384m
    ports:
    - 127.0.0.1:8080:8080
    depends_on:
      auth:
        condition: service_healthy
      catalogo:
        condition: service_healthy
      carrito:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, --max-time, '3', http://127.0.0.1:8080/actuator/health]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  mysql-auth: {}
  mysql-catalogo: {}
  mysql-carrito: {}
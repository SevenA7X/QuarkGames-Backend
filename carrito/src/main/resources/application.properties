spring.application.name=carrito
# Puerto asignado en el api-gateway de Mario (route "carrito-service")
server.port=8082

# ===== Base de datos MySQL propia de este microservicio =====
spring.datasource.url=jdbc:mysql://localhost:3306/quarkgames_carrito_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# "update" conserva los carritos entre reinicios
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Comunicación con el MS Catálogo (OpenFeign) =====
# El carrito llama DIRECTO al catálogo (no pasa por el gateway: es comunicación interna)
catalogo.url=http://localhost:8081
# Si el catálogo no responde, no dejamos al usuario esperando para siempre
spring.cloud.openfeign.client.config.catalogo.connect-timeout=2000
spring.cloud.openfeign.client.config.catalogo.read-timeout=5000

# ===== Swagger =====
# UI: http://localhost:8082/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

spring.application.name=carrito
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/quarkgames_carrito_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Comunicación con el MS Catálogo (OpenFeign) =====
# El carrito llama DIRECTO al catálogo (no pasa por el gateway: es comunicación interna)
catalogo.url=http://localhost:8081
spring.cloud.openfeign.client.config.catalogo.connect-timeout=2000
spring.cloud.openfeign.client.config.catalogo.read-timeout=5000

# Clave compartida para el endpoint interno /internal/juegos/descontar-stock del catálogo.
# Debe ser IGUAL en carrito y catálogo. Se puede sobrescribir con la variable de entorno INTERNAL_KEY.
catalogo.internal-key=${INTERNAL_KEY:quarkgames-clave-interna-dev}

# ===== Swagger =====
# UI: http://localhost:8082/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

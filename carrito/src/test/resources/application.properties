# Configuración SOLO para las pruebas: H2 en memoria en lugar de MySQL.
# OJO: este archivo REEMPLAZA al de src/main/resources durante las pruebas,
# por eso debe tener TODAS las propiedades que usa el código.
spring.datasource.url=jdbc:h2:mem:carritotest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# En las pruebas el cliente Feign se reemplaza por un mock, pero la URL debe existir
catalogo.url=http://localhost:9999
catalogo.internal-key=clave-de-prueba
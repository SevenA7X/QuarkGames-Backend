spring.application.name=auth
# Puerto asignado en el api-gateway de Mario (route "auth-service")
server.port=8083

# ===== Base de datos MySQL propia de este microservicio =====
# createDatabaseIfNotExist=true crea el esquema si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/quarkgames_auth_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# "update" conserva los datos entre reinicios (no usar create-drop aquí,
# o el admin se borraría cada vez que se apaga el servicio)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Swagger =====
# UI: http://localhost:8083/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

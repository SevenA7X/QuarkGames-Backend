spring.application.name=auth
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/quarkgames_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JWT =====
# Genera y valida tokens JWT firmados con HMAC-SHA (HS384, porque la clave tiene 384 bits). Se puede sobrescribir con la
# variable de entorno JWT_SECRET. Los demás microservicios que validen el token
# deben usar exactamente la misma clave.
jwt.secret=${JWT_SECRET:WZ6zGZwI3mF/BibbuzY/pvQx2EQ+qjXOlOkJVSlvupeHfOj+kOlmGvZRkDcgsrgp}
# Duración del token en milisegundos (3600000 = 1 hora)
jwt.expiracion-ms=3600000

# ===== Administrador inicial =====
# DataLoader lo crea al arrancar si no existe, guardando la clave con BCrypt.
# Son las mismas credenciales que usaba el frontend (admin / 1234).
app.admin.usuario=${ADMIN_USUARIO:admin}
app.admin.clave=${ADMIN_CLAVE:1234}

# ===== Swagger =====
# UI: http://localhost:8083/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

spring.application.name=auth
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/quarkgames_auth_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JWT =====
# Clave HMAC-SHA en Base64 (mínimo 256 bits). Se puede sobrescribir con la
# variable de entorno JWT_SECRET. Los demás microservicios que validen el token
# deben usar exactamente la misma clave.
jwt.secret=${JWT_SECRET:WZ6zGZwI3mF/BibbuzY/pvQx2EQ+qjXOlOkJVSlvupeHfOj+kOlmGvZRkDcgsrgp}
# Duración del token en milisegundos (3600000 = 1 hora)
jwt.expiracion-ms=3600000

# ===== Swagger =====
# UI: http://localhost:8083/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

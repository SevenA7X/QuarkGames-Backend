spring.application.name=catalogo
spring.datasource.url=jdbc:mysql://localhost:3306/quarkgames_catalogo_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=


spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8081

# Habilita la ejecución de scripts SQL en bases de datos externas como MySQL
spring.sql.init.mode=always

# Asegura que Hibernate cree las tablas antes de ejecutar el script de datos
spring.jpa.defer-datasource-initialization=true

# Clave compartida para el endpoint interno /internal/juegos/descontar-stock (lo usa el MS Carrito).
# Debe ser IGUAL en carrito y catálogo. Se puede sobrescribir con la variable de entorno INTERNAL_KEY.
internal.key=${INTERNAL_KEY:quarkgames-clave-interna-dev}

# ===== JWT (validación de tokens del MS Auth) =====
# Debe ser EXACTAMENTE la misma clave que jwt.secret del MS Auth: así el catálogo
# puede verificar la firma del token sin llamar a Auth. Se puede sobrescribir con JWT_SECRET.
jwt.secret=${JWT_SECRET:WZ6zGZwI3mF/BibbuzY/pvQx2EQ+qjXOlOkJVSlvupeHfOj+kOlmGvZRkDcgsrgp}
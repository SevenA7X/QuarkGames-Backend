# Configuración SOLO para las pruebas: H2 en memoria en lugar de MySQL.
# Este archivo REEMPLAZA al de src/main/resources durante las pruebas,
# por eso tiene TODAS las propiedades que usa el código.
spring.datasource.url=jdbc:h2:mem:catalogotest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always


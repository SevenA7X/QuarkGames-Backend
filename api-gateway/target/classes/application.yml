server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173" 
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        
        - id: catalogo-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/juegos/**, /api/v1/categorias/**
        
       
        - id: carrito-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/carrito/**
            
        - id: auth-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/auth/**